---
- name: Full Borrowly stack deployment
  hosts: app_servers
  become: true
  roles:
    - docker
    - app
    - monitoring

  post_tasks:
    - name: Verify all containers are running
      command: docker compose -f {{ app_dir }}/docker-compose.yaml ps --format json
      register: compose_status
      changed_when: false

    - name: Print container status
      debug:
        var: compose_status.stdout_lines
