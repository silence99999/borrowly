name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test-go:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - item-service
          - rental-service
          - review-service
          - chat-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...

      - name: test
        working-directory: services/${{ matrix.service }}
        run: go test ./...

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx tsc --noEmit
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  docker-build:
    name: Docker build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test-go, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: services/auth-service
          - service: item-service
            context: services/item-service
          - service: rental-service
            context: services/rental-service
          - service: review-service
            context: services/review-service
          - service: chat-service
            context: services/chat-service
          - service: gateway
            context: .
            dockerfile: gateway/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
