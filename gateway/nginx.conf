upstream auth_svc   { server auth-service:5001; }
upstream item_svc   { server item-service:5002; }
upstream rental_svc { server rental-service:5003; }
upstream review_svc { server review-service:5004; }
upstream chat_svc   { server chat-service:5005; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # ── API routes ──────────────────────────────────────────────────────────
    # Each block: rewrite strips the /api prefix, then proxy_pass uses the
    # rewritten URI against the named upstream.
    # IMPORTANT: more-specific regex must come before less-specific ones.

    # Reviews  (must be before the general /api/items block)
    location ~ ^/api/items/[^/]+/reviews {
        rewrite ^/api(/.+)$ $1 break;
        proxy_pass http://review_svc;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # Item images  (must be before the general /api/items block)
    location ~ ^/api/items/[^/]+/images {
        rewrite ^/api(/.+)$ $1 break;
        proxy_pass http://item_svc;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # Auth
    location ~ ^/api/auth {
        rewrite ^/api(/.+)$ $1 break;
        proxy_pass http://auth_svc;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # Items (general: list, detail, CRUD, /items/my)
    location ~ ^/api/items {
        rewrite ^/api(/.+)$ $1 break;
        proxy_pass http://item_svc;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # Pickup points
    location ~ ^/api/pickup-points {
        rewrite ^/api(/.+)$ $1 break;
        proxy_pass http://item_svc;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # Rentals  (plural resource)
    location ~ ^/api/rentals {
        rewrite ^/api(/.+)$ $1 break;
        proxy_pass http://rental_svc;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # Rental  (singular: /rental/{id}/cancel|pay)
    location ~ ^/api/rental/ {
        rewrite ^/api(/.+)$ $1 break;
        proxy_pass http://rental_svc;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # Chat
    location ~ ^/api/chats {
        rewrite ^/api(/.+)$ $1 break;
        proxy_pass http://chat_svc;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # ── Frontend SPA ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
